<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Pricing Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f4f4f4;
        }

        .pricing-card {
            width: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
            padding: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pricing-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .pricing-card h2 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 32px;
            color: #007BFF;
            margin: 15px 0;
        }

        .pricing-card ul {
            list-style: none;
            margin: 20px 0;
        }

        .pricing-card ul li {
            margin: 10px 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #0056b3;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .pricing-card {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="pricing-card">
        <h2>Basic Plan</h2>
        <p class="price">₹499/month</p>

        <ul>
            <li>✔ 10 GB Storage</li>
            <li>✔ Free Support</li>
            <li>✔ 1 User</li>
        </ul>

        <a href="#" class="btn">Buy Now</a>
    </div>

</body>
</html>
