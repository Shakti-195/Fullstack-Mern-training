<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration form</title>
</head>
<body>

    <fieldset height = "100px">
        <legend><b>BBD University Registration Form</b></legend>
    <form>
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" name="firstname" placeholder="ram" required>

        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" name="lastname" placeholder="siya" required>
    </br>
    </br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder ="example@gmail.com" required>
    </br>
    </br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder ="8423726725" required>
    </br>
    </br>
        <label for="date">DOB:</label>
        <input type="date" id="date" name="date" required>
    </br>
    </br>
        <label for="rollno">RollNo:</label>
        <input type="num" id="num" name="num" required>
    </br>
    </br>
        <label for="address">Address:</label>
        </br>
        <textarea id="name" name="address"  rows="4" cols="40"></textarea>
    </br>
    </br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="example123@"required>
    </br>
    </br>
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="example123@"  required>
    </br>
    </br>
        <button type="submit" value="submit">Register</button>
        <button type="reset" value = "reset">Reset</button>
        
    </form>
    <feildset>
</body>
</html>
