<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Webpage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        header, nav, main, section, article, footer {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 10px;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }

        nav {
            background-color: #333;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        section {
            background-color: #f4f4f4;
        }

        article {
            background-color: white;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <section>
            <h2>Welcome</h2>

            <article>
                <h3>Article Title</h3>
                <p>
                    This is a sample article inside the section of the webpage.
                    It demonstrates the use of semantic HTML tags.
                </p>
            </article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
