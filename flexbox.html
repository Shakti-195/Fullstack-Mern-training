<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Cards</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap: wrap;
            margin: 40px;
        }

        .card {
            width: 220px;
            padding: 20px;
            border: 1px solid #000;
            text-align: center;
            background-color: #f4f4f4;
            border-radius: 8px;
            margin: 10px;
        }

        .card h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
        </div>

    </div>

</body>
</html>
