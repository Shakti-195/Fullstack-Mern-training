<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Hero Section</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            min-height: 100vh;
            padding: 40px;
            flex-wrap: wrap;
        }

        .hero-image img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 4px solid #333;
            object-fit: cover;
        }

        .hero-content {
            max-width: 500px;
        }

        .hero-content h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }

            .hero-content h1 {
                font-size: 32px;
            }

            .hero-image img {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <section class="hero">

        <div class="hero-image">
            <img src="profile.jpg" alt="Profile Image">
        </div>

        <div class="hero-content">
            <h1>Hello, I'm Shakti Singh</h1>
            <p>
                I am a Full Stack Developer passionate about building
                responsive and user-friendly web applications using
                HTML, CSS, JavaScript, React, and Python.
            </p>

            <a href="#" class="btn">Hire Me</a>
        </div>

    </section>

</body>
</html>
